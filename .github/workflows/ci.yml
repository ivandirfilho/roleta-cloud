name: Roleta Cloud CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    # Sx-CI: Postgres service para testes que precisam de PG real (S1+).
    # pgvector image inclui extensão vector pre-instalada; AGE não é necessário no CI
    # (testes de grafo são integration, rodam em ambiente dedicado).
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: roleta_test
          POSTGRES_USER: roleta
          POSTGRES_PASSWORD: roleta_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roleta -d roleta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ROLETA_PG_DSN: postgresql://roleta:roleta_ci_password@localhost:5432/roleta_test
      ROLETA_TEST_PG_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap PG schemas + extensions
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          export PGPASSWORD=roleta_ci_password
          psql -h localhost -U roleta -d roleta_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U roleta -d roleta_test -c "CREATE SCHEMA IF NOT EXISTS cw; CREATE SCHEMA IF NOT EXISTS ccw; CREATE SCHEMA IF NOT EXISTS shared;"
          psql -h localhost -U roleta -d roleta_test -c "SELECT extname, extversion FROM pg_extension;"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      # C2 (12/06): main vermelho desde 27/05 — bootstrap criava schemas mas
      # nunca aplicava migrations → UndefinedTable cw.spins_vectors em
      # tests/test_cdc_worker.py. Mesma causa-raiz do drift em prod (P0.2).
      - name: Apply alembic migrations
        run: alembic upgrade head

      - name: Run tests with coverage (SP-34 CI-02)
        # Ramp SP-34.1: 50 → 70 (12/06; cobertura real medida: 72%).
        # Próximo degrau: 75 quando server/ ganhar testes unitários (P4.1).
        run: python -m pytest tests/ -v --tb=short --cov=core --cov=state --cov=database --cov-report=term-missing --cov-fail-under=70

      - name: DNA coverage lint (SP-10)
        run: python tools/lint_dna_coverage.py

      - name: Schema symmetry check (ISO-S1 / NEW-03)
        run: python scripts/schema_symmetry.py

      - name: Silent except baseline lint (SP-05)
        run: python tools/lint_silent_except.py

      - name: Syntax check (all .py files)
        run: python -m py_compile main.py && find . -name "*.py" -not -path "./__pycache__/*" -not -path "./archive/*" | head -30 | xargs -I{} python -m py_compile {}

  # SPR-V2: a lógica de alinhamento de fase da extensão MV3 (o que impede a extensão de
  # FABRICAR giros) só é coberta por `node --test`. Sem este job a única proteção contra a
  # regressão rodaria apenas na máquina de quem lembrasse de digitar o comando.
  # SPR-V3: o mesmo vale para `tools/vision_spike/` — o spike não é caminho de produção,
  # mas é ele que decide se o SPR-V5 destrava; um estimador que apodrece em silêncio
  # produziria um GO/NO-GO sobre código que ninguém mais executa.
  # NB: `node --test <dir>` tenta carregar o diretório como módulo — use os globs.
  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run extension unit + flow tests
        run: node --test "tests/js/*.test.js" "tools/vision_spike/tests/*.test.js"

  ci-ok:
    needs: [lint-and-test, extension-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Gate agregador (check estavel para branch protection)
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ]; then
            echo "lint-and-test=${{ needs.lint-and-test.result }}"; exit 1
          fi
          if [ "${{ needs.extension-tests.result }}" != "success" ]; then
            echo "extension-tests=${{ needs.extension-tests.result }}"; exit 1
          fi
          echo "ci-ok"
