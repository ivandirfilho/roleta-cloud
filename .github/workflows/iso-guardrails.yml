name: ISO guardrails

on:
  pull_request:
    branches: [main, develop]

jobs:
  iso-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear graphify-out no diff (regenerável)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -E '^graphify-out/(graph\.json|graph\.html)$'; then
            echo "::error::graphify-out/graph.* não deve entrar em PR (artefato regenerável)."
            exit 1
          fi
          echo "OK: sem graphify-out/graph.* no diff."

      - name: Lembrete ISO (ADENDO) — advisory
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          if echo "$changed" | grep -qE '^(app_config/|server/|strategies/|state/|core/|docker-compose\.yml)'; then
            if ! echo "$changed" | grep -q 'Manutenabilidade_iso.md'; then
              echo "::warning::Mudança de comportamento sem ADENDO em Manutenabilidade_iso.md — confirme se aplica (convenção ISO)."
            fi
          fi
          echo "advisory ok."
