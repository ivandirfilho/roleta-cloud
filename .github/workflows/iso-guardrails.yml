name: ISO guardrails

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear graphify-out no diff (regenerável)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only --diff-filter=AM "$base" "$head" | grep -E '^graphify-out/(graph\.json|graph\.html)$'; then
            echo "::error::graphify-out/graph.* não deve entrar em PR (artefato regenerável)."
            exit 1
          fi
          echo "OK: sem graphify-out/graph.* no diff."

      - name: ADENDO ISO obrigatório em mudança de comportamento (16/08)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          title="${{ github.event.pull_request.title }}"
          changed="$(git diff --name-only "$base" "$head")"
          # Reverts de emergência (main-red) não podem ser bloqueados por doc.
          case "$title" in
            Revert*|revert*) echo "revert de emergência — ADENDO dispensado (documente no PR body)"; exit 0 ;;
          esac
          if echo "$changed" | grep -qE '^(app_config/|server/|strategies/|state/|core/|docker-compose\.yml)'; then
            if ! echo "$changed" | grep -qE '^docs/iso/adendos/.+\.md$'; then
              echo "::error::Mudança de comportamento sem ADENDO. Crie arquivo NOVO docs/iso/adendos/AAAA-MM-DD-<slug>.md (convenção no README da pasta; Manutenabilidade_iso.md está congelado — append lá NÃO conta)."
              exit 1
            fi
          fi
          echo "ADENDO ok (ou mudança fora do escopo de comportamento)."
