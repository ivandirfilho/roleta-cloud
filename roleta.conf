server {
    listen 80;
    server_name roleta.xma-ia.com www.roleta.xma-ia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name roleta.xma-ia.com www.roleta.xma-ia.com;

    ssl_certificate /etc/letsencrypt/live/roleta.xma-ia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roleta.xma-ia.com/privkey.pem;

    root /var/www/roleta;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # SPR-D1 (16/08/2026): expõe o /health do container (8766) para diagnóstico
    # EXTERNO. Sem este bloco, `/ws` respondendo 502 era ambíguo: não dava para
    # distinguir "processo inteiro morto" de "WS morto com health vivo" sem ssh
    # no host — foi exatamente o buraco do incidente do Glass Box OFFLINE.
    # Payload é inócuo: {"status","uptime_sec","version","ts"} (sem segredos,
    # sem dado de aposta). Leitura dos códigos: 200 = app de pé · 502 = app
    # morto/crash-loop · 404 = este conf ainda NÃO está instalado no host.
    location = /health {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # /metrics é o MESMO upstream, mas carrega métrica de negócio (stake, hits,
    # banca) — não é dado público. O Prometheus raspa localmente, então o acesso
    # externo é opt-in: allowlist explícita aqui. Efeito colateral útil: de fora
    # este path devolve 403 (e não 404) assim que o conf novo está instalado,
    # servindo de sonda de versão do próprio nginx.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
