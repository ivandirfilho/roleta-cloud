# Roleta Cloud — Compose STANDALONE para a VM Azure (canary → cutover).
#
# Difere do docker-compose.yml (produção HostDime) apenas no NECESSÁRIO para rodar
# na Azure; a geometria/estratégia/INV-3 são IDÊNTICAS (mesmos defaults de flags).
#
#   1. `image:` fixado por DIGEST (imutável) em vez de `build:` — a imagem vem do
#      ACR (acrroletaprod). Defina ROLETA_IMAGE no .env (o deploy-azure.sh resolve
#      e grava o digest corrente). Sem build no host (C3/A1).
#   2. Volume `roleta-data` faz bind no disco PERSISTENTE (/opt/roleta/data), para o
#      state.json/decisions.db sobreviverem a realocação da VM (o resource disk local
#      da série L é efêmero). os.replace() continua atômico (mesmo ext4).
#   3. Reverse proxy é o Caddy NATIVO do host (/etc/caddy/Caddyfile) → 127.0.0.1:8765,
#      exatamente como a HostDime usa nginx→loopback. Por isso as portas seguem só em
#      loopback (nunca públicas); quem expõe 80/443 é o Caddy.
#
# Rationale completa de CADA flag: ver docker-compose.yml (fonte da verdade). Os
# valores abaixo replicam 1:1 o flag-set de produção capturado na HostDime.
services:
  roleta-cloud:
    image: ${ROLETA_IMAGE:?defina ROLETA_IMAGE=acrroletaprod.azurecr.io/roleta-cloud@sha256:<digest> no .env (use deploy-azure.sh)}
    container_name: roleta-cloud
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 64m
    # MIG-0: tempo para GameState.save() persistir antes do SIGKILL.
    stop_grace_period: 60s
    # VF-0: SYS_PTRACE para py-spy attach no PID 1.
    cap_add:
      - SYS_PTRACE
    # Portas SÓ em loopback — o Caddy nativo do host publica 80/443 e faz proxy.
    ports:
      - "127.0.0.1:${WS_PORT:-8765}:8765"
      - "127.0.0.1:8766:8766"
    volumes:
      - roleta-data:/app/data
      - ./server/configs:/app/server/configs:ro
    environment:
      - WS_HOST=0.0.0.0
      - WS_PORT=8765
      # MIG-0: state.json dentro do volume persistente (os.replace atômico).
      - STATE_FILE=/app/data/state.json
      - SSL_ENABLED=${SSL_ENABLED:-false}
      - SSL_CERT=${SSL_CERT:-}
      - SSL_KEY=${SSL_KEY:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      # Secret (vem do Key Vault via kv-to-env.sh → .env). Vazio = auth desligada.
      - ROLETA_API_KEY=${ROLETA_API_KEY:-}
      # HOOK-1: DSN do Postgres. Vazio no canary = hook de publicação OFF (SQLite
      # é a fonte autoritativa; dual_write permanece desligado até a Onda de PG).
      - ROLETA_PG_DSN=${ROLETA_PG_DSN:-}
      # 📸 Vision / OCR (LIGADO em produção).
      - SDA_VISION_OCR=${SDA_VISION_OCR:-1}
      - SDA_VISION_MODEL_ALIASES=${SDA_VISION_MODEL_ALIASES:-roletaaovivo=Roleta ao Vivo}
      # V4: geometria 3 regiões (21 números). ON em produção.
      - SDA_REGIONS_V4=${SDA_REGIONS_V4:-1}
      # S-STAKE / Block-Gale TETO 1 (= flat, sem ruína). INV-3: veto nunca suprime aposta.
      - SDA_STAKING_MODE=${SDA_STAKING_MODE:-block_gale}
      # V5.2 em produção: 17/21 por sentido, assinatura-4 e flip puro.
      - SDA_BET_PAIR=${SDA_BET_PAIR:-v5_1721}
      - SDA_V5_SIG4=${SDA_V5_SIG4:-1}
      - SDA_SUGESTAO_BROADCAST=${SDA_SUGESTAO_BROADCAST:-1}
      - SDA_V5_FLIP_PURO=${SDA_V5_FLIP_PURO:-1}
      # SDA_V5_COVERAGE_LOCK: shadow-validada em 16/08; "" mantém o seletor
      # 17/21 atual byte-idêntico, "17" trava cobertura 17 e "21" força 21.
      # Escalada paga somente se r>11,1pp (E[delta]=36r-4); relatório:
      # tools/coverage_gate_report.py. Rollback: SDA_V5_COVERAGE_LOCK="" + redeploy.
      - SDA_V5_COVERAGE_LOCK=${SDA_V5_COVERAGE_LOCK:-}
      - SDA_FORCE17_EXACT=${SDA_FORCE17_EXACT:-0}
      - GALE_CAP=${GALE_CAP:-1}
      - GALE_BANKROLL=${GALE_BANKROLL:-1000}
      - GALE_ONLY_AFTER_GREEN=${GALE_ONLY_AFTER_GREEN:-0}
      - C_SELECTION_AUTO_PROMOTE=${C_SELECTION_AUTO_PROMOTE:-0}
      # Vision fill-forward (metadata; não toca aposta). ON em produção.
      - SDA_DEALER_FILL_FORWARD=${SDA_DEALER_FILL_FORWARD:-1}
      - SDA_DEALER_FORCE_PROFILE=${SDA_DEALER_FORCE_PROFILE:-0}
      - SDA_VISION_ATTACH_MAX_AGE_S=${SDA_VISION_ATTACH_MAX_AGE_S:-0}
      # Phantom dedup — OFF por padrão (toca aposta).
      - SDA_DEDUP_PHANTOM=${SDA_DEDUP_PHANTOM:-0}
      - SDA_DEDUP_PHANTOM_WINDOW_MS=${SDA_DEDUP_PHANTOM_WINDOW_MS:-20000}
      # DIR2..DIR19 (sentido-fase) — estado de produção (ON onde a HostDime tem ON).
      - SDA_HISTORICO_NAO_DIRECIONAL=${SDA_HISTORICO_NAO_DIRECIONAL:-1}
      - SDA_SENTIDO_AUTORITATIVO=${SDA_SENTIDO_AUTORITATIVO:-1}
      - SDA_PHASE_RECONCILE=${SDA_PHASE_RECONCILE:-1}
      - SDA_DEDUP_SEQ=${SDA_DEDUP_SEQ:-1}
      # SPR-V1: phase hardening remains default-OFF until the client rollout.
      - SDA_PHASE_BUFFER_SYNC=${SDA_PHASE_BUFFER_SYNC:-0}
      - SDA_PHASE_MIN_OVERLAP=${SDA_PHASE_MIN_OVERLAP:-0}
      - SDA_MIN_SPIN_INTERVAL_MS=${SDA_MIN_SPIN_INTERVAL_MS:-0}
      - SDA_PHASE_ALT_METRIC=${SDA_PHASE_ALT_METRIC:-0}
      # A HostDime liga DNA realize via .env. Na Azure o valor fica explícito no
      # compose porque kv-to-env.sh recria o .env a cada deploy.
      - SDA_DNA_REALIZE=${SDA_DNA_REALIZE:-1}
      - SDA_DNA_REALIZE_EVERY=${SDA_DNA_REALIZE_EVERY:-20}
      - SDA_DIRECTION_VISION=${SDA_DIRECTION_VISION:-0}
      - SDA_DIRECTION_VISION_MIN_CONF=${SDA_DIRECTION_VISION_MIN_CONF:-0.7}
      - SDA_DIRECTION_VISION_SHADOW=${SDA_DIRECTION_VISION_SHADOW:-1}
      - SDA_DIRECTION_VISION_TTL_MS=${SDA_DIRECTION_VISION_TTL_MS:-30000}
      - SDA_PHASE_EVENT_AUDIT=${SDA_PHASE_EVENT_AUDIT:-1}
      # PG-CTX (06/08, PR #60): projeta contexto da decisao em spin_features.
      # Espelho do default de producao (OFF; rollout: worker primeiro).
      - SDA_PG_FEATURE_CONTEXT=${SDA_PG_FEATURE_CONTEXT:-1}
      # R2 dealer-aware + Error Engine: shadow ligado em 16/08 por decisão do
      # Diretor após a análise resultados_semana_10_08_16_08.md.
      # Rollback: =0 + redeploy. Live continua OFF.
      - SDA_R2_DEALER=${SDA_R2_DEALER:-0}
      - SDA_R2_DEALER_SHADOW=${SDA_R2_DEALER_SHADOW:-1}
      - SDA_ERROR_ENGINE=${SDA_ERROR_ENGINE:-1}
      - SDA_RESET_REANCORA=${SDA_RESET_REANCORA:-1}
      - SDA_UNCERTAIN_REANCORA=${SDA_UNCERTAIN_REANCORA:-1}
      - SDA_SENTIDO_AUTORITATIVO_SHADOW=${SDA_SENTIDO_AUTORITATIVO_SHADOW:-1}
      - SDA_LOCK_TOTAL=${SDA_LOCK_TOTAL:-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8766/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Onda PG/CDC: profile explicitamente inerte no canário.
  # deploy-azure.sh --with-pg --with-cdc resolve CDC_IMAGE por digest.
  cdc-worker:
    profiles: ["cdc"]
    image: ${CDC_IMAGE:-acrroletaprod.azurecr.io/roleta-cdc-worker:disabled}
    container_name: roleta-cdc-worker
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - ROLETA_PG_DSN=${ROLETA_PG_DSN:-}
      - CDC_BATCH_SIZE=${CDC_BATCH_SIZE:-100}
      - CDC_LOG_LEVEL=${CDC_LOG_LEVEL:-INFO}
      - CDC_ANALYZE_EVERY_N=${CDC_ANALYZE_EVERY_N:-0}
    healthcheck:
      test: ["CMD-SHELL", "test $(($(date +%s) - $(stat -c %Y /tmp/cdc_alive 2>/dev/null || echo 0))) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Bind no disco PERSISTENTE. /opt/roleta/data DEVE estar em disco gerenciado
  # (OS disk ou data disk), NUNCA no resource disk efêmero (/mnt) da série L.
  roleta-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/roleta/data
