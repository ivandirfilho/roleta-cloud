# Alembic config — gerenciado pelo S2 do plano_implentacao_pos_sessao_24_05.md.
# DSN é injetada via env var ROLETA_PG_DSN (vide migrations/env.py).
#
# Comandos:
#   alembic current
#   alembic upgrade head
#   alembic revision -m "nome"
#   alembic downgrade -1
#
# Rollback de qualquer migration: ver docs/runbooks/rollback.md.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
