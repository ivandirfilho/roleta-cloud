# Roleta Cloud — stack PROD no Debian HostDime
# Roda LADO A LADO do compose existente (roleta-cloud), em network separada.
# Sprint S4 do plano_implentacao_pos_sessao_24_05.md (Debian-first).
#
# CDC worker (S5) e ativado apenas via profile:
#   docker compose -f docker-compose.pg.yml --profile cdc --env-file .env.pg up -d
# Por default, sobe apenas postgres.

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: roleta/postgres-stack:pg15-age15
    container_name: roleta-pg
    environment:
      POSTGRES_DB: roleta
      POSTGRES_USER: roleta
      POSTGRES_PASSWORD: ${PG_PASSWORD:?defina PG_PASSWORD via .env ou sops}
    command:
      - postgres
      - -c
      - shared_preload_libraries=age
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
      # S4-BAK-2: WAL archiving via wal-g -> Backblaze B2
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=. /etc/wal-g/env && /usr/local/bin/wal-g wal-push %p
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/pg:/backups
      # S4-BAK-2: wal-g binary + creds (host-side, NEVER commit /etc/wal-g/env)
      - ./wal-g/wal-g:/usr/local/bin/wal-g:ro
      - /etc/wal-g:/etc/wal-g:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roleta -d roleta"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ----- S5: CDC worker -----
  # Desligado por default. Ativar quando publisher (database/outbox_publisher.py)
  # estiver integrado ao fluxo de escrita (feature_flag dual_write_pg=true).
  # Subir com:
  #   docker compose -f docker-compose.pg.yml --profile cdc --env-file .env.pg up -d
  cdc-worker:
    profiles: ["cdc"]
    build:
      context: .
      dockerfile: docker/cdc-worker/Dockerfile
    image: roleta/cdc-worker:latest
    container_name: roleta-cdc-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ROLETA_PG_DSN: postgresql://roleta:${PG_PASSWORD:?}@postgres:5432/roleta
      CDC_BATCH_SIZE: "100"
      CDC_LOG_LEVEL: "INFO"
    # VF-5: healthcheck via flag-file que o worker toca a cada loop (cdc_worker.py)
    healthcheck:
      test: ["CMD-SHELL", "test $(($(date +%s) - $(stat -c %Y /tmp/cdc_alive 2>/dev/null || echo 0))) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: roleta_pgdata_prod
