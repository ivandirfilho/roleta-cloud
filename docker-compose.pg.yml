# Roleta Cloud — stack PROD no Debian HostDime
# Roda LADO A LADO do compose existente (roleta-cloud), em network separada.
# Sprint S4 do plano_implentacao_pos_sessao_24_05.md (Debian-first).
#
# CDC worker (S5) e ativado apenas via profile:
#   docker compose -f docker-compose.pg.yml --profile cdc --env-file .env.pg up -d
# Por default, sobe apenas postgres.

services:
  postgres:
    # H7 (03/08): imagem upstream oficial — build custom (AGE+Timescale)
    # removido: as extensões nunca saíram do CREATE EXTENSION (0 grafos,
    # 0 hypertables). Rollout no servidor exige DROP EXTENSION age CASCADE
    # ANTES de trocar a imagem (ver Manutenabilidade_iso.md ADENDO 03/08).
    image: pgvector/pgvector:pg15
    container_name: roleta-pg
    environment:
      POSTGRES_DB: roleta
      POSTGRES_USER: roleta
      POSTGRES_PASSWORD: ${PG_PASSWORD:?defina PG_PASSWORD via .env ou sops}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
      # S4-BAK-2: WAL archiving via wal-g -> Backblaze B2
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=. /etc/wal-g/env && /usr/local/bin/wal-g wal-push %p
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/pg:/backups
      # H7 (03/08): init scripts (schemas cw/ccw/shared + extensões) — só
      # rodam em initdb (primeiro boot de volume novo); prod já os aplicou.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # S4-BAK-2: wal-g binary + creds (host-side, NEVER commit /etc/wal-g/env)
      - ./wal-g/wal-g:/usr/local/bin/wal-g:ro
      - /etc/wal-g:/etc/wal-g:ro
      # Fix 03/08: imagem upstream pgvector/pgvector:pg15 NAO traz
      # ca-certificates -> wal-g falhava TLS contra o B2 (x509 unknown
      # authority) em backup-push E archive_command. Monta os certs do host.
      - /etc/ssl/certs:/etc/ssl/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roleta -d roleta"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ----- S5: CDC worker -----
  # Desligado por default. Ativar quando publisher (database/outbox_publisher.py)
  # estiver integrado ao fluxo de escrita (feature_flag dual_write_pg=true).
  # Subir com:
  #   docker compose -f docker-compose.pg.yml --profile cdc --env-file .env.pg up -d
  cdc-worker:
    profiles: ["cdc"]
    build:
      context: .
      dockerfile: docker/cdc-worker/Dockerfile
    image: roleta/cdc-worker:latest
    container_name: roleta-cdc-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ROLETA_PG_DSN: postgresql://roleta:${PG_PASSWORD:?}@postgres:5432/roleta
      CDC_BATCH_SIZE: "100"
      CDC_LOG_LEVEL: "INFO"
      # H4 (03/08): ANALYZE periódico a cada N batches não-vazios nas tabelas
      # quentes (spins_vectors/spin_features/decision_dna/outbox) — mantém
      # estatísticas do planner frescas p/ HNSW e window queries.
      # Default 0 = OFF (inviolável). Ligar via .env.pg do host (ex.: 50).
      CDC_ANALYZE_EVERY_N: ${CDC_ANALYZE_EVERY_N:-0}
      # 🧩 PG feature-context (correção 06/08): habilita a projeção das colunas
      # de contexto (dealer/"table"/provider/round_id/wheel_model/vision_*/
      # spin_seq/direction_*/phase_uncertain + centro_previsto/gale_level) que
      # chegam DENTRO do evento `spin_result`. Default 0 = OFF (inviolável).
      # Lida a cada evento, mas a env é fixa por container ⇒ trocar exige
      # `--force-recreate`. Ligue AQUI ANTES de ligar no app (docker-compose.yml):
      # com o produtor à frente, o evento enriquecido é consumido como legado e o
      # ON CONFLICT DO NOTHING só permite reparo via backfill.
      SDA_PG_FEATURE_CONTEXT: ${SDA_PG_FEATURE_CONTEXT:-1}
    # VF-5: healthcheck via flag-file que o worker toca a cada loop (cdc_worker.py)
    healthcheck:
      test: ["CMD-SHELL", "test $(($(date +%s) - $(stat -c %Y /tmp/cdc_alive 2>/dev/null || echo 0))) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: roleta_pgdata_prod
