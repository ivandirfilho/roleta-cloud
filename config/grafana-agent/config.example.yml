server:
  log_level: warn
metrics:
  global:
    scrape_interval: 30s
    external_labels:
      host: xmaiajpvm
      env: prod
      project: roleta-cloud
    remote_write:
    - url: https://prometheus-prod-40-prod-sa-east-1.grafana.net/api/prom/push
      basic_auth:
        username: <PROM_USER_FROM_GRAFANA_CLOUD>
        password: <TOKEN_FROM_/root/secrets/grafana_token>
  wal_directory: /var/lib/grafana-agent/wal
  configs:
  - name: roleta
    scrape_configs:
    - job_name: postgres
      static_configs:
      - targets:
        - 127.0.0.1:9187
        labels:
          service: postgres
          instance: roleta-pg
    remote_write: null
logs:
  positions_directory: /var/lib/grafana-agent
  configs:
  - name: docker
    clients:
    - url: https://logs-prod-024.grafana.net/loki/api/v1/push
      basic_auth:
        username: <LOKI_USER_FROM_GRAFANA_CLOUD>
        password: <TOKEN_FROM_/root/secrets/grafana_token>
      external_labels:
        host: xmaiajpvm
        env: prod
        project: roleta-cloud
    scrape_configs:
    - job_name: docker-json
      static_configs:
      - targets:
        - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
      pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: log
      - labels:
          stream: ''
