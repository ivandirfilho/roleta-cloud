services:
  roleta-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roleta-cloud
    restart: unless-stopped
    # S-INFRA-1 §17: limite memoria evita OOM no host se houver leak natural.
    # Consumo atual estavel em ~31MB; 512m oferece 16x folga sem afetar peers.
    mem_limit: 512m
    mem_reservation: 64m
    # VF-0: SYS_PTRACE para py-spy attach no PID 1 (debugging runtime)
    cap_add:
      - SYS_PTRACE
    ports:
      - "127.0.0.1:${WS_PORT:-8765}:8765"
      # VF-3/VF-4: /metrics (Prometheus) + /health (HTTP healthcheck)
      - "127.0.0.1:8766:8766"
    volumes:
      - roleta-data:/app/data
      - ./state.json:/app/state.json
      - ./server/configs:/app/server/configs:ro
    environment:
      - WS_HOST=0.0.0.0
      - WS_PORT=8765
      - SSL_ENABLED=${SSL_ENABLED:-false}
      - SSL_CERT=${SSL_CERT:-}
      - SSL_KEY=${SSL_KEY:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - ROLETA_API_KEY=${ROLETA_API_KEY:-}
      # 🎯 ROOT CAUSE HOOK-1: sem essa var, o hook nunca consegue init
      # (lia DSN como None e marcava _publisher_init_attempted=True para sempre)
      - ROLETA_PG_DSN=${ROLETA_PG_DSN:-}
      # V4 (14/06): geometria de 3 regiões disjuntas de 7 = 21 números (C1
      # força+shift M5, C2 gravidade circular, C3 zona fria). ON por decisão do
      # operador (sem backtest). Desativar: SDA_REGIONS_V4=0 no host + redeploy,
      # ou git revert. Spec/auditoria: refatoracao_estrategica_13_06.md.
      - SDA_REGIONS_V4=${SDA_REGIONS_V4:-1}
      # S-STAKE (14/06) — MIGRAÇÃO gale -> flat. Stake CONSTANTE U*N (21u na V4)
      # por sentido, sem escalação por streak (elimina o sangramento do Gale:
      # backtest -77u gale vs +99u flat nas mesmas ~309 jogadas). Default do
      # código é 'gale' (app_config/settings.py, fail-safe); PRODUÇÃO roda 'flat'
      # por esta env. Rollback: SDA_STAKING_MODE=gale no host + redeploy, ou git
      # revert. Spec/auditoria: flat_kelly_junho.md.
      #
      # IMPL aposta 14# + Block-Gale (17/06): go-live da estrutura nova
      # (implantação_c_variavel_gale_junho.md §17). Default do repo ativa a
      # aposta de 14# (par C2+C3 fixo) com staking block_gale TETO 1
      # (= flat-equivalente, SEM ruína — o estudo resultados_15_junho.md mostrou
      # que gale só sangra; cap=1 é o único seguro). Rollback total: no host,
      # SDA_BET_PAIR=full + SDA_STAKING_MODE=flat + redeploy, ou git revert.
      - SDA_STAKING_MODE=${SDA_STAKING_MODE:-block_gale}
      # Cobertura (atualizado 18/06): force17 = C1=ForceLast + geometria 17# =
      # C2(±3)=7 ∪ C3(±2)=5 ∪ C1=ForceLast(±2)=5 (3 regiões, união real ~15),
      # isolado por sentido. É a SAÍDA NOVA de produção (analise_400 PARTES VII–XV:
      # menor breakeven 47% e menor variância). Histórico: c2c3 (14#, 17/06) e
      # var_c1c2_c3 (voto, DESATIVADO). "full"=3 centros (21#); c1c3/c2c3 estáticos.
      # Rollback: SDA_BET_PAIR=c2c3 (ou full) no host + redeploy, ou git revert.
      - SDA_BET_PAIR=${SDA_BET_PAIR:-force17}
      # force17 "sempre 17 números" (18/06, pedido do operador): completa a união
      # para EXATAMENTE 17 quando o overlap das 3 regiões a reduz (estende as regiões
      # para fora, SEM mover os centros — preserva o ForceLast). Default ON. Voltar à
      # união real ~15 do estudo (analise_400): SDA_FORCE17_EXACT=0 no host + redeploy.
      - SDA_FORCE17_EXACT=${SDA_FORCE17_EXACT:-1}
      # Teto do block-gale: 1=flat (seguro, default). Subir é opt-in de risco.
      - GALE_CAP=${GALE_CAP:-1}
      # Banca de referência para o solvency-guard do block-gale (R$).
      - GALE_BANKROLL=${GALE_BANKROLL:-1000}
      # "Só apostar após green" — OFF por padrão (não suprime indicação; INV-3).
      - GALE_ONLY_AFTER_GREEN=${GALE_ONLY_AFTER_GREEN:-0}
      # Promoção automática de regra do CSelectionEngine: OFF (só sugere; humano aplica).
      - C_SELECTION_AUTO_PROMOTE=${C_SELECTION_AUTO_PROMOTE:-0}
    # VF-4: healthcheck via endpoint HTTP /health (sem poluir logs de WS handshake)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8766/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  roleta-data:
    driver: local
