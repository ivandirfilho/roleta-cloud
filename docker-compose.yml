services:
  roleta-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roleta-cloud
    restart: unless-stopped
    # S-INFRA-1 §17: limite memoria evita OOM no host se houver leak natural.
    # Consumo atual estavel em ~31MB; 512m oferece 16x folga sem afetar peers.
    mem_limit: 512m
    mem_reservation: 64m
    # VF-0: SYS_PTRACE para py-spy attach no PID 1 (debugging runtime)
    cap_add:
      - SYS_PTRACE
    ports:
      - "127.0.0.1:${WS_PORT:-8765}:8765"
      # VF-3/VF-4: /metrics (Prometheus) + /health (HTTP healthcheck)
      - "127.0.0.1:8766:8766"
    volumes:
      - roleta-data:/app/data
      - ./state.json:/app/state.json
      - ./server/configs:/app/server/configs:ro
    environment:
      - WS_HOST=0.0.0.0
      - WS_PORT=8765
      - SSL_ENABLED=${SSL_ENABLED:-false}
      - SSL_CERT=${SSL_CERT:-}
      - SSL_KEY=${SSL_KEY:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - ROLETA_API_KEY=${ROLETA_API_KEY:-}
      # 🎯 ROOT CAUSE HOOK-1: sem essa var, o hook nunca consegue init
      # (lia DSN como None e marcava _publisher_init_attempted=True para sempre)
      - ROLETA_PG_DSN=${ROLETA_PG_DSN:-}
      # 📸 Vision (foto_roleta): OCR foto->dados LIGADO por padrão (deve ficar
      # ligado e funcionando direto). Fixado explícito aqui (versionado) p/ não
      # depender só do default do código. Desliga só com SDA_VISION_OCR=0.
      - SDA_VISION_OCR=${SDA_VISION_OCR:-1}
      # 📸 Vision (foto_roleta): aliases p/ fundir variantes de OCR do nome da mesa
      # (ex.: 'Roleta aoVivo' e 'Roleta ao Vivo' -> mesmo canonico). Chave normalizada
      # sem espacos/caixa. Operador adiciona novos pares: "chave=Nome Canonico,...".
      - SDA_VISION_MODEL_ALIASES=${SDA_VISION_MODEL_ALIASES:-roletaaovivo=Roleta ao Vivo}
      # V4 (14/06): geometria de 3 regiões disjuntas de 7 = 21 números (C1
      # força+shift M5, C2 gravidade circular, C3 zona fria). ON por decisão do
      # operador (sem backtest). Desativar: SDA_REGIONS_V4=0 no host + redeploy,
      # ou git revert. Spec/auditoria: refatoracao_estrategica_13_06.md.
      - SDA_REGIONS_V4=${SDA_REGIONS_V4:-1}
      # S-STAKE (14/06) — MIGRAÇÃO gale -> flat. Stake CONSTANTE U*N (21u na V4)
      # por sentido, sem escalação por streak (elimina o sangramento do Gale:
      # backtest -77u gale vs +99u flat nas mesmas ~309 jogadas). Default do
      # código é 'gale' (app_config/settings.py, fail-safe); PRODUÇÃO roda 'flat'
      # por esta env. Rollback: SDA_STAKING_MODE=gale no host + redeploy, ou git
      # revert. Spec/auditoria: flat_kelly_junho.md.
      #
      # IMPL aposta 14# + Block-Gale (17/06): go-live da estrutura nova
      # (implantação_c_variavel_gale_junho.md §17). Default do repo ativa a
      # aposta de 14# (par C2+C3 fixo) com staking block_gale TETO 1
      # (= flat-equivalente, SEM ruína — o estudo resultados_15_junho.md mostrou
      # que gale só sangra; cap=1 é o único seguro). Rollback total: no host,
      # SDA_BET_PAIR=full + SDA_STAKING_MODE=flat + redeploy, ou git revert.
      - SDA_STAKING_MODE=${SDA_STAKING_MODE:-block_gale}
      # Cobertura (atualizado 18/06): force17 = C1=ForceLast + geometria 17# =
      # C2(±3)=7 ∪ C3(±2)=5 ∪ C1=ForceLast(±2)=5 (3 regiões, união real ~15),
      # isolado por sentido. É a SAÍDA NOVA de produção (analise_400 PARTES VII–XV:
      # menor breakeven 47% e menor variância). Histórico: c2c3 (14#, 17/06) e
      # var_c1c2_c3 (voto, DESATIVADO). "full"=3 centros (21#); c1c3/c2c3 estáticos.
      # Rollback: SDA_BET_PAIR=c2c3 (ou full) no host + redeploy, ou git revert.
      - SDA_BET_PAIR=${SDA_BET_PAIR:-force17}
      # force17 EXATO "sempre 17 números" — **default OFF** (realinhado ao estudo
      # 18/06). O estudo (analise_400 L940) recomenda a UNIÃO real ~15 (overlap
      # benéfico: breakeven 42,8% < 47,2%); forçar 17 PIORA (alarga a aposta). OFF =
      # união ~15 (fiel ao estudo). ON (=1) é opt-in p/ consistência visual de 17,
      # ao custo de breakeven +4,4pts. Rollback/opt-in: SDA_FORCE17_EXACT=1 + redeploy.
      - SDA_FORCE17_EXACT=${SDA_FORCE17_EXACT:-0}
      # Teto do block-gale: 1=flat (seguro, default). Subir é opt-in de risco.
      - GALE_CAP=${GALE_CAP:-1}
      # Banca de referência para o solvency-guard do block-gale (R$).
      - GALE_BANKROLL=${GALE_BANKROLL:-1000}
      # "Só apostar após green" — OFF por padrão (não suprime indicação; INV-3).
      - GALE_ONLY_AFTER_GREEN=${GALE_ONLY_AFTER_GREEN:-0}
      # Promoção automática de regra do CSelectionEngine: OFF (só sugere; humano aplica).
      - C_SELECTION_AUTO_PROMOTE=${C_SELECTION_AUTO_PROMOTE:-0}
      # 📸 Vision (auditoria_pos_foto 21/06) — 3 flags de higiene/cobertura, todas
      # DEFAULT OFF (rollback trivial, ISO obrig. #4: flags vivem no compose).
      # 📸 Vision (auditoria_pos_foto 21/06 + resultados_bancos 22/06) — vision-context
      # fill-forward: a foto/OCR e' a fonte autoritativa de dealer/modelo/provider (o
      # DOM da Evolution NAO os expoe); propaga o ultimo OCR da sessao a TODA jogada
      # p/ dados 100% acoplados (auditaveis/estrategia). Metadata, NAO toca aposta.
      # LIGADO em producao (=1) por decisao do dono. Rollback: =0 + redeploy.
      - SDA_DEALER_FILL_FORWARD=${SDA_DEALER_FILL_FORWARD:-1}
      # Consumidor dormante de perfil de força por dealer (n≥30). Só após ramp-up.
      - SDA_DEALER_FORCE_PROFILE=${SDA_DEALER_FORCE_PROFILE:-0}
      # Janela máx (s) p/ a foto/OCR colar na última decisão. 0 = sem limite
      # (comportamento atual). >0 = hardening anti cross-spin quando o OCR atrasa.
      - SDA_VISION_ATTACH_MAX_AGE_S=${SDA_VISION_ATTACH_MAX_AGE_S:-0}
      # Phantom dedup (auditoria resultados_bancos 22/06): rejeita re-envio do mesmo
      # numero+sentido em janela curta (extensao re-detecta DOM estatico). DEFAULT
      # OFF (toca aposta). Ligar so apos validar: SDA_DEDUP_PHANTOM=1.
      - SDA_DEDUP_PHANTOM=${SDA_DEDUP_PHANTOM:-0}
      - SDA_DEDUP_PHANTOM_WINDOW_MS=${SDA_DEDUP_PHANTOM_WINDOW_MS:-20000}
      # DIR2 (sentido-fase): historico inicial/correcao como contexto NAO-DIRECIONAL.
      # O historico do DOM nao carrega o sentido real (a extensao o fabrica por
      # alternancia retroativa); hoje alimenta timeline_cw/ccw via process_spin e
      # envenena o motor. ATIVADO (default ON) apos validacao (suite 689 verde + 2x
      # code-review). Rollback: SDA_HISTORICO_NAO_DIRECIONAL=0 no host + redeploy.
      - SDA_HISTORICO_NAO_DIRECIONAL=${SDA_HISTORICO_NAO_DIRECIONAL:-1}
      # DIR3-5 (sentido-fase): servidor como AUTORIDADE da fase do sentido. ATIVADO
      # (default ON) — o servidor passa a decidir o sentido em vez de obedecer o cliente
      # (muda p/ qual lado a aposta vai). Rollback: SDA_SENTIDO_AUTORITATIVO=0 + redeploy.
      - SDA_SENTIDO_AUTORITATIVO=${SDA_SENTIDO_AUTORITATIVO:-1}
      # DIR4 (sentido-fase): reconciliacao de fase por SHIFT — consome allNumbers
      # (12 ultimos, hoje ignorados) p/ contar giros reais e recuperar gap de fase.
      # ATIVADO (default ON). Rollback: SDA_PHASE_RECONCILE=0 no host + redeploy.
      - SDA_PHASE_RECONCILE=${SDA_PHASE_RECONCILE:-1}
      # DIR6 (sentido-fase): idempotencia por trace_id (reenvios/re-render chegam com
      # o mesmo trace_id). Mais robusto que numero+dir+ms. ATIVADO (default ON).
      - SDA_DEDUP_SEQ=${SDA_DEDUP_SEQ:-1}
      # DIR7 (sentido-fase): fusao da fonte de VIDEO (stand-by acoplavel). O futuro
      # servico de video publica direction_event; se confiavel, confirma/sobrepoe o
      # toggle. Default OFF (video inerte). Ligar: SDA_DIRECTION_VISION=1.
      - SDA_DIRECTION_VISION=${SDA_DIRECTION_VISION:-0}
      - SDA_DIRECTION_VISION_MIN_CONF=${SDA_DIRECTION_VISION_MIN_CONF:-0.7}
      # DIR16 (sentido-fase): FIX CRITICO #S/#W/#X — reset_session zera seed_parity
      # (a menos que direction_locked); handle_history_correction/handle_initial_history
      # reanchoram fase. Sem isto, apos troca de dealer/mesa, DIR5 segue projetando com
      # paridade da MESA ANTERIOR (auto-seed nunca dispara pq seed_parity nao zera) —
      # vetor real de aposta no lado errado em handoff. ATIVADO (default ON).
      # Rollback: SDA_RESET_REANCORA=0 no host + redeploy.
      - SDA_RESET_REANCORA=${SDA_RESET_REANCORA:-1}
      # DIR17 (sentido-fase): FIX #T — reancora a fase quando phase_advance retorna sem
      # alinhamento (matched=False, troca de mesa silenciosa). Sem isto, project_phase
      # segue projetando com seed antigo + spin_seq que continua incrementando -> direcao
      # autoritativa errada persiste por N giros. ATIVADO (default ON).
      # Rollback: SDA_UNCERTAIN_REANCORA=0 no host + redeploy.
      - SDA_UNCERTAIN_REANCORA=${SDA_UNCERTAIN_REANCORA:-1}
    # VF-4: healthcheck via endpoint HTTP /health (sem poluir logs de WS handshake)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8766/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  roleta-data:
    driver: local
