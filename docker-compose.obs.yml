# Roleta Cloud — Observability stack (S-OBS-10 §18)
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.pg.yml -f docker-compose.obs.yml up -d prometheus grafana
#
# Acessos:
#   Prometheus: http://127.0.0.1:9090
#   Grafana:    http://127.0.0.1:3000 (admin/roleta_admin — trocar via env GF_SECURITY_ADMIN_PASSWORD)
#
# Junta-se a network `roleta-cloud_default` para scrape direto via DNS (roleta-cloud:8766).

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: roleta-prometheus
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    user: "65534:65534"  # nobody (UID prometheus)
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./obs/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: roleta-grafana
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 96m
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-roleta_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # S-OBS-16: AlertManager — recebe alertas do Prometheus e os encaminha
  # via webhook para roleta-cloud (/api/alerts/sink). Sem Telegram nesta v1.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: roleta-alertmanager
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    user: "65534:65534"
    volumes:
      - ./obs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # PLAN-V2-06: volume persistente para silences/notification log
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
