groups:
  - name: roleta_state_health
    interval: 30s
    rules:
      - alert: RoletaAdaptiveStateLost
        expr: roleta_adaptive_state_keys_count < 5
        for: 2m
        labels: { severity: critical, component: state }
        annotations:
          summary: "Adaptive state perdido (keys={{ $value }})"
          description: "BUG-NOVO-11 detector: _adaptive_state caiu para <5 chaves por 2min."

      - alert: RoletaSigmoidEmpty
        expr: roleta_sigmoid_off_populated == 0
        for: 2m
        labels: { severity: critical, component: state }
        annotations:
          summary: "sigmoid_off vazio"
          description: "Strategy adaptativa zerada. Verificar deploy/state.json."

      - alert: RoletaStateFileStale
        expr: roleta_state_file_age_seconds > 300
        for: 2m
        labels: { severity: warning, component: state }
        annotations:
          summary: "state.json sem update há {{ $value }}s"

      - alert: RoletaNoSpinsRecent
        expr: roleta_seconds_since_last_spin > 300
        for: 1m
        labels: { severity: warning, component: ingestion }
        annotations:
          summary: "Sem spins há {{ $value }}s"

      - alert: RoletaNoMaster
        expr: (roleta_ws_connections > 0) and (roleta_master_present == 0)
        for: 1m
        labels: { severity: critical, component: ingestion }
        annotations:
          summary: "Sem WS MASTER eleito com {{ $value }} conexao(oes) ativa(s) — spins descartados; forcar MASTER ou reiniciar roleta-cloud"

      - alert: RoletaAccuracyDegraded
        expr: (roleta_recent_acc_cw < 0.30) or (roleta_recent_acc_ccw < 0.30)
        for: 10m
        labels: { severity: info, component: strategy }
        annotations:
          summary: "Accuracy < 30% por 10min"

      - alert: RoletaMetricsScrapeErrors
        expr: increase(roleta_metrics_scrape_errors_total[5m]) > 0
        for: 5m
        labels: { severity: warning, component: observability }
        annotations:
          summary: "Erros em refresh de métricas custom"

      # NEW-12 (26/05): defesa contra bugs silenciosos pos-deploy
      # (descoberto durante a sprint W-02: B-09 fez calibration_error
      # cair a 0/N sem alarme). Dispara quando fill rate < 80% por 15min
      # com volume minimo de 50 decisoes APOSTAR/h (evita ruido em
      # janelas com pouco trafego).
      - alert: RoletaCalibrationFillRateLow
        expr: (roleta_calibration_fill_rate_1h < 0.8) and (roleta_decisions_with_result_1h >= 50)
        for: 15m
        labels: { severity: warning, component: observability }
        annotations:
          summary: "calibration_error fill rate {{ $value | humanizePercentage }} < 80% (1h)"
          description: "Coluna calibration_error nao esta sendo populada. Investigar pending key mismatch (B-09-like) ou regressao no caminho W-01+W-02+B-08 do message_handler."

      # SP-31 (OBS-03 27/05): drift fino da SDA17 — alerta quando p50
      # da distancia da roleta passa de 3.5 slots por 30min com volume
      # minimo (n>=30 amostras). Datasource: SP-30 OBS-02.
      - alert: RoletaWheelDistP50High
        expr: (roleta_wheel_dist_p50_1h > 3.5) and (roleta_wheel_dist_samples_1h >= 30)
        for: 30m
        labels: { severity: warning, component: strategy }
        annotations:
          summary: "wheel_dist p50 = {{ $value }} slots > 3.5 por 30min (n>=30)"
          description: "SDA17 derivou. Conferir SDA17 offset adaptativo (sigmoid_off) e considerar batch_tune ou pull-back manual. Se p95>7, investigar mesa/dealer com regime atipico."

      # SP-29 (OBS-01 27/05): DNA realize lag — alerta se features DNA
      # mais antigas que 5min nao foram realizadas (hit/wheel_dist
      # preenchidos via dna_update_realized). Indica regressao no
      # caminho update_result do message_handler.
      - alert: RoletaDnaRealizeLagHigh
        expr: roleta_dna_realize_lag_seconds > 300
        for: 5m
        labels: { severity: warning, component: observability }
        annotations:
          summary: "DNA realize lag = {{ $value }}s > 300s"
          description: "{{ $value }}s sem realized_lift_pp/hit na decision_dna mais antiga unrealized ({{ with query \"roleta_dna_unrealized_count\" }}{{ . | first | value }}{{ end }} features). Conferir hook dna_update_realized em server/message_handler.py."

      # B5 PROFIT-LEDGER (12/06): stop-loss visível — P&L da sessão corrente.
      # O gate INV-3 já reduz o stake a 1u automaticamente; o alerta torna o
      # evento visível ao operador/dashboards (severidade warning, não page).
      - alert: RoletaSessionPnlLow
        expr: roleta_session_pnl_units <= -30
        for: 1m
        labels: { severity: warning, component: profit }
        annotations:
          summary: "P&L da sessão = {{ $value }}u <= -30u (stop-loss ativo)"
          description: "INV-3 já modulou o stake para 1u. Considerar reset de sessão (botão) ou encerrar. Painel: Roleta Profit."

      # Sangria acumulada anormal no dia (sem reset compensar).
      - alert: RoletaAllTimePnlDropFast
        expr: (roleta_all_time_pnl_units - (roleta_all_time_pnl_units offset 1h)) < -120
        for: 5m
        labels: { severity: warning, component: profit }
        annotations:
          summary: "P&L acumulado caiu {{ $value }}u na última hora"
          description: "Queda > 120u/h mesmo com CUT v1+stop-loss. Investigar sessões/dealer; conferir painel Roleta Profit."

      # SV-03 (12/06): regime de viés por região — a roda "anda" num sentido.
      # Gatilho objetivo para o operador considerar reset de sessão (P10).
      # O M5 (REGION_SHIFT_V1) já corrige até ±4 casas automaticamente; o
      # alerta cobre vieses persistentes/extremos.
      - alert: RoletaRegionBiasHigh
        expr: (abs(roleta_region_err_ema{region="C1"}) > 4) and on(direction) (roleta_region_err_n{region="C1"} >= 10)
        for: 5m
        labels: { severity: warning, component: strategy }
        annotations:
          summary: "Viés de região {{ $labels.direction }}: EMA C1 = {{ $value }} casas (n>=10)"
          description: "A bola está caindo sistematicamente deslocada do centro previsto neste sentido. M5 está corrigindo (ver roleta_region_shift); se persistir, considerar reset de sessão (botão) ou troca de mesa."

  - name: roleta_strategy_alerts
    interval: 30s
    rules:
      # S-OBS-14 — Shadow grid: alerta quando algum challenger bate incumbent
      # de forma sustentada.
      - alert: RoletaShadowBeatingIncumbent
        expr: roleta_shadow_alert == 1
        for: 15m
        labels: { severity: warning, component: strategy }
        annotations:
          summary: "Shadow challenger batendo incumbent há 15min (shift campeão={{ $value }})"
          description: "Investigar /api/shadow — pode haver off-by-N no sigmoid_off."

      # KILL switch disparando demais — sinal de threshold mal calibrado.
      - alert: RoletaKillPullsHigh
        expr: increase(roleta_kill_pulls_total[1h]) > 30
        for: 5m
        labels: { severity: warning, component: kill_switch }
        annotations:
          summary: "KILL v4 disparou {{ $value }}× na última hora"
          description: "Volume anormal. Conferir thresholds dinâmicos vs regime de vol."

      # Volatilidade extrema sustentada — pode indicar dealer/mesa anômala.
      - alert: RoletaVolatilityExtreme
        expr: (roleta_recent_acc_cw > 0.65) or (roleta_recent_acc_ccw > 0.65) or (roleta_recent_acc_cw < 0.30) or (roleta_recent_acc_ccw < 0.30)
        for: 10m
        labels: { severity: info, component: strategy }
        annotations:
          summary: "Acc fora da faixa [0.30, 0.65] por 10min (vol regime extremo)"

      # Batch tune pull-backs em rajada — estratégia oscilando.
      - alert: RoletaBatchTunePullbackBurst
        expr: (increase(roleta_batch_tune_pullback_cw_total[30m]) + increase(roleta_batch_tune_pullback_ccw_total[30m])) > 6
        for: 5m
        labels: { severity: warning, component: strategy }
        annotations:
          summary: "Mais de 6 pull-backs em 30min — possível oscilação"

  - name: roleta_target_health
    interval: 30s
    rules:
      - alert: RoletaTargetDown
        expr: up{job="roleta-cloud"} == 0
        for: 1m
        labels: { severity: critical, component: app }
        annotations:
          summary: "Target roleta-cloud DOWN há 1min"

  # ===== SPR-V1 (05/08): saude da FASE autoritativa =====
  # Os contadores sao expostos como Gauge monotonico (padrao DIR12); increase()
  # continua valido, com a ressalva de que restart do processo zera o gauge.
  - name: roleta_fase_v1
    interval: 30s
    rules:
      # DIR22: a fase e um toggle — dois giros consecutivos no mesmo sentido, fora de
      # gap/reset, significam fase corrompida (aposta no lado errado).
      - alert: RoletaAlternanciaViolada
        expr: increase(roleta_alternancia_violada_total[15m]) > 0
        for: 1m
        labels: { severity: critical, component: fase }
        annotations:
          summary: "Alternancia de sentido violada ({{ $value }}x em 15min)"
          description: "Fase possivelmente corrompida. Conferir seed_parity/seed_n e considerar set_seed do operador."

      # Rajada de phase_uncertain: buffer de fase defasado (furo A) ou troca de mesa.
      - alert: RoletaPhaseUncertainBurst
        expr: increase(roleta_phase_uncertain_total[15m]) > 5
        for: 5m
        labels: { severity: warning, component: fase }
        annotations:
          summary: "phase_uncertain {{ $value }}x em 15min"
          description: "Verificar SDA_PHASE_BUFFER_SYNC e roleta_phase_buffer_missing_total/roleta_phase_ambiguo_total."

      # DIR21: giro fisicamente impossivel — replay/injecao ou cliente em loop.
      - alert: RoletaSpinImplausivel
        expr: increase(roleta_spin_implausivel_total[15m]) > 0
        for: 1m
        labels: { severity: warning, component: fase }
        annotations:
          summary: "Giro implausivel descartado ({{ $value }}x em 15min)"
          description: "Giro abaixo de SDA_MIN_SPIN_INTERVAL_MS. Possivel replay/injecao ou extensao reenviando."

  # ===== SPR-V4 (05/08): contrato `direction_event` + trilha `phase_events` =====
  # Shadow-only: nenhuma destas regras indica risco de aposta (a visao NAO tem
  # autoridade sobre o giro — fail-close do SPR-V1). Elas guardam a INTEGRIDADE DA
  # EVIDENCIA: sem trilha honesta, nenhum gate de shadow pode ser avaliado.
  - name: roleta_visao_v4
    interval: 30s
    rules:
      # Producao de visao dessincronizada: eventos chegando fora do TTL do servidor
      # (30s) — relogio do produtor, fila ou lote atrasado. Nunca vira direcao, mas
      # zera a cobertura util da janela.
      - alert: RoletaVisionStaleAlto
        expr: increase(roleta_vision_stale_total[15m]) > 3
        for: 5m
        labels: { severity: warning, component: visao }
        annotations:
          summary: "direction_event stale {{ $value }}x em 15min"
          description: "Eventos fora do TTL (SDA_DIRECTION_VISION_TTL_MS). Conferir latencia do produtor e roleta_vision_coverage_ratio antes de ler qualquer taxa de acordo."

      # Trilha falhando = decisao sem disposicao. O giro e a aposta seguem intactos
      # (degradacao explicita: decisao obrigatoria, auditoria best-effort), mas a
      # janela DEIXA de valer como evidencia do gate T4.
      - alert: RoletaPhaseEventsWriteError
        expr: increase(roleta_phase_events_write_error_total[15m]) > 0
        for: 1m
        labels: { severity: warning, component: visao }
        annotations:
          summary: "Falha de escrita em phase_events ({{ $value }}x em 15min)"
          description: "Trilha de auditoria degradada — janela invalidada como evidencia T4. Conferir disco/WAL do SQLite e o circuit breaker; a aposta NAO foi afetada."
